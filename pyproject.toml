[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.bandit]
exclude_dirs = ['tests', 'migrations']
skips = ['B101']
test = ['B101', 'B102', 'B112']

[tool.flake8]
max-line-length = 88
extend-ignore = ['E203', 'W503']
exclude = [
    '.git',
    '__pycache__',
    'build',
    'dist',
    'migrations',
    'venv',
    '.venv',
    'env',
    '.env',
    'node_modules',
]
per-file-ignores = [
    '__init__.py:F401',
    'tests/*:S101',  # Ignore assert statements in tests
]
select = [
    'E',  # pycodestyle errors
    'W',  # pycodestyle warnings
    'F',  # pyflakes
    'C',  # mccabe complexity
    'B',  # flake8-bugbear
    'I',  # isort
    'N',  # pep8-naming
    'D',  # pydocstyle
]
max-complexity = 10 